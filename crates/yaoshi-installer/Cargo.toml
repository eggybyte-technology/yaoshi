[package]
name = "yaoshi-installer"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "yaoshi-installer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
nix = { version = "0.31.3", features = ["fs", "mount", "reboot", "term", "poll", "process"] }
yaoshi-common = { path = "../yaoshi-common" }
yaoshi-image = { path = "../yaoshi-image" }
yaoshi-payload = { path = "../yaoshi-payload" }
yaoshi-screen = { path = "../yaoshi-screen" }
